server:
  port: 8080

spring:
  application:
    name: exam-platform-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/examdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jackson:
    time-zone: America/Mexico_City
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItZXhhbS1wbGF0Zm9ybS1tYXJzZWxsYS0yMDI2LXNwcmluZy1ib290LWF1dGg=}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days
