services:
  postgres:
    image: postgres:16-alpine
    container_name: marsella_exam_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-America/Mexico_City}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-examdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - exam_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marsella_exam_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/examdb}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-c3VwZXItc2VjcmV0LWtleS1mb3ItZXhhbS1wbGF0Zm9ybS1tYXJzZWxsYS0yMDI2LXNwcmluZy1ib290LWF1dGg=}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      TZ: ${TZ:-America/Mexico_City}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - exam_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: marsella_exam_frontend_dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: ${TZ:-America/Mexico_City}
      VITE_BACKEND_URL: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_DEV_PORT:-3000}:3000"
    networks:
      - exam_network

volumes:
  postgres_data:
    name: general_postgres_data
    external: true

networks:
  exam_network:
    driver: bridge

