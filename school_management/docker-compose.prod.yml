services:
  postgres:
    image: postgres:16-alpine
    container_name: marsella_exam_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD es obligatoria}
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-examdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marsella_exam_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/examdb}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Error: SPRING_DATASOURCE_PASSWORD es obligatoria}
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET es obligatoria}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      TZ: ${TZ:-America/Mexico_City}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms512m -Xmx1536m}
    networks:
      - exam_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marsella_exam_frontend
    restart: always
    environment:
      TZ: ${TZ:-America/Mexico_City}
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - exam_network

volumes:
  postgres_data:
    name: marsella_postgres_data

networks:
  exam_network:
    driver: bridge
